# Stages the CLI on npm when a GitHub release is published on this
# repository. A maintainer then approves the stage on npmjs.com, and only
# then is the version public. See docs/release.md in the monorepo, Moving
# to Trusted Publishing.
#
# There is no npm token. npm accepts the upload through a short lived OIDC
# token from this workflow (Trusted Publishing), and attaches a provenance
# attestation that points at this run. On npmjs.com the package's trusted
# publisher is this repository, this file and the npm environment, with
# direct npm publish left off, so this workflow can only stage.
#
# Two jobs, so no build time package runs where that token can be minted.
# build installs without install scripts, lints, typechecks, tests, builds
# and packs, with contents read only, and uploads the tarball. stage alone
# holds id-token write. It checks out nothing, installs nothing and runs no
# package script, and stages the tarball build packed. Before approving,
# the maintainer compares the staged tarball with a local build of the same
# source, scripts/check-staged-cli.sh in the monorepo.
# src/release-workflow.test.ts guards this shape.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The GitHub App client id for the device flow. Public. The build
      # inlines it.
      GITHUB_CLIENT_ID: Ov23liER4N1b1XVokKPA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "refusing. Release tag $TAG is not v$version from package.json." >&2
            exit 1
          fi
      # esbuild finds its binary in the platform package the lockfile pins,
      # so the build needs no install script.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The tarball npm stages, name-version.tgz, packed from dist and the
      # files package.json lists.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm 11.5.1 or newer speaks OIDC to the registry. Node 24 ships it,
          # Node 22 does not.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/pack
      # npm runs no lifecycle script when the spec is a tarball, and
      # --ignore-scripts says so too. This uploads the version as a stage
      # and publishes nothing. The maintainer approves it with npm stage
      # approve, see docs/release.md.
      - name: Stage the tarball
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm stage publish "$RUNNER_TEMP/pack/sealkeeper-${TAG#v}.tgz" --provenance --access public --ignore-scripts
